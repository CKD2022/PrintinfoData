        function generateColors(count) {
            const presetColors = [
                '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7',

                '#D2B4DE', '#A3E4D7', '#FAD7A0', '#AED6F1', '#A9CCE3'
            ];

            const colors = [];
            for (let i = 0; i < count; i++) {
                if (i < presetColors.length) {
                    colors.push(presetColors[i]);
                } else {
                    const hue = (i * 137.5) % 360;
                    colors.push(`hsl($${hue}, 75%, 60%)`);
                }
            }
            return colors;

        // ========== 表格字号调节 ==========
        window.adjustTableFontSize = function(categoryKey, delta) {
            const settings = getSettings(categoryKey);
            let newSize = (settings.tableFontSize || 12) + delta;
            if (newSize < 9) newSize = 9;
            if (newSize > 18) newSize = 18;
            settings.tableFontSize = newSize;
            document.getElementById(`tableFontSizeDisplay_${categoryKey}`).textContent = newSize + 'px';
            const slider = document.querySelector(`#chartContainer_${categoryKey} .table-font-slider`);
            if (slider) slider.value = newSize;
            const headerSlider = document.querySelector(`#table_${categoryKey}`)?.closest('.category-header')?.querySelector('.table-font-slider');
            if (headerSlider) headerSlider.value = newSize;
            applyTableFontSize(categoryKey);
        };

        window.adjustTableFontSizeFromSlider = function(categoryKey, value) {
            const settings = getSettings(categoryKey);
            settings.tableFontSize = parseInt(value);
            document.getElementById(`tableFontSizeDisplay_${categoryKey}`).textContent = settings.tableFontSize + 'px';
            applyTableFontSize(categoryKey);
        };

        function applyTableFontSize(categoryKey) {
            const settings = getSettings(categoryKey);
            const table = document.getElementById(`table_${categoryKey}`);
            if (!table) return;
            const fontSize = settings.tableFontSize || 12;
            table.querySelectorAll('td, tbody tr, tbody td').forEach(el => {
                el.style.fontSize = fontSize + 'px';
            });
            table.querySelectorAll('thead th').forEach(el => {
                el.style.fontSize = Math.max(10, fontSize - 1) + 'px';
            });
            table.querySelectorAll('.total-row td, .total-row').forEach(el => {
                el.style.fontSize = fontSize + 'px';
            });
        }

        // ========== 特殊纸令数表格字号调节 ==========
        window.adjustSpecialTableFontSize = function(delta) {
            let newSize = specialTableFontSize + delta;
            if (newSize < 9) newSize = 9;
            if (newSize > 18) newSize = 18;
            specialTableFontSize = newSize;
            document.getElementById('specialTableFontSizeDisplay').textContent = newSize + 'px';
            const slider = document.querySelector('#specialPaperSection .table-font-slider');
            if (slider) slider.value = newSize;
            applySpecialTableFontSize();
        };

        window.adjustSpecialTableFontSizeFromSlider = function(value) {
            specialTableFontSize = parseInt(value);
            document.getElementById('specialTableFontSizeDisplay').textContent = specialTableFontSize + 'px';
            applySpecialTableFontSize();
        };

        function applySpecialTableFontSize() {
            const table = document.getElementById('specialPaperTable');
            if (!table) return;
            const fontSize = specialTableFontSize;
            table.querySelectorAll('td, th, tbody tr, tbody td, thead th, tfoot td').forEach(el => {
                el.style.fontSize = fontSize + 'px';
            });
        }

        // ========== 显示内容切换 ==========
        window.toggleShow = function(categoryKey, type, checked) {
            const settings = getSettings(categoryKey);
            if (type === 'name') settings.showName = checked;
            else if (type === 'value') settings.showValue = checked;
            else if (type === 'percent') settings.showPercent = checked;
            applyChartSettings(categoryKey);
        };

        function getSettings(categoryKey) {
            if (!chartSettings[categoryKey]) chartSettings[categoryKey] = { size: 100, fontSize: 9, showName: true, showValue: false, showPercent: false, tableFontSize: 12, radius: 100 };
            return chartSettings[categoryKey];
        }

        // ========== 饼图大小调节 - 使用radius参数 ==========
        window.adjustChartSize = function(categoryKey, delta) {
            const settings = getSettings(categoryKey);
            let newSize = (settings.radius || 100) + delta;
            if (newSize < 20) newSize = 20;
            if (newSize > 200) newSize = 200;
            settings.radius = newSize;
            document.getElementById(`sizeDisplay_${categoryKey}`).textContent = newSize + '%';
            const slider = document.querySelector(`#chartContainer_${categoryKey} .size-slider`);
            if (slider) slider.value = newSize;
            applyChartSettings(categoryKey);
        };

        window.adjustChartSizeFromSlider = function(categoryKey, value) {
            const settings = getSettings(categoryKey);
            settings.radius = parseInt(value);
            document.getElementById(`sizeDisplay_${categoryKey}`).textContent = settings.radius + '%';
            applyChartSettings(categoryKey);
        };

        window.adjustFontSize = function(categoryKey, delta) {
            const settings = getSettings(categoryKey);
            let newSize = settings.fontSize + delta;
            if (newSize < 5) newSize = 5;
            if (newSize > 20) newSize = 20;
            settings.fontSize = newSize;
            document.getElementById(`fontSizeDisplay_${categoryKey}`).textContent = newSize + 'px';
            const slider = document.querySelector(`#chartContainer_${categoryKey} .font-slider`);
            if (slider) slider.value = newSize;
            applyChartSettings(categoryKey);
        };

        window.adjustFontSizeFromSlider = function(categoryKey, value) {
            const settings = getSettings(categoryKey);
            settings.fontSize = parseFloat(value);
            document.getElementById(`fontSizeDisplay_${categoryKey}`).textContent = settings.fontSize + 'px';
            applyChartSettings(categoryKey);
        };

        window.resetChartSettings = function(categoryKey) {
            const settings = getSettings(categoryKey);
            settings.radius = 100;
            settings.fontSize = 9;
            settings.showName = true;
            settings.showValue = false;
            settings.showPercent = false;
            settings.tableFontSize = 12;
            document.getElementById(`sizeDisplay_${categoryKey}`).textContent = '100%';
            document.getElementById(`fontSizeDisplay_${categoryKey}`).textContent = '9px';
            document.getElementById(`tableFontSizeDisplay_${categoryKey}`).textContent = '12px';
            const container = document.getElementById(`chartContainer_${categoryKey}`);
            if (container) {
                const sizeSlider = container.querySelector('.size-slider');
                if (sizeSlider) sizeSlider.value = 100;
                const fontSlider = container.querySelector('.font-slider');
                if (fontSlider) fontSlider.value = 9;
                const checks = container.querySelectorAll('.checkbox-group input[type="checkbox"]');
                if (checks.length >= 3) {
                    checks[0].checked = true;
                    checks[1].checked = false;
                    checks[2].checked = false;
                }
            }
            const headerSlider = document.querySelector(`#table_${categoryKey}`)?.closest('.category-header')?.querySelector('.table-font-slider');
            if (headerSlider) headerSlider.value = 12;
            applyChartSettings(categoryKey);
            applyTableFontSize(categoryKey);
        };

        function applyChartSettings(categoryKey) {
            const container = document.getElementById(`chartContainer_${categoryKey}`);
            if (!container || container.classList.contains('hidden')) return;
            const settings = getSettings(categoryKey);

            const data = window[`chartData_${categoryKey}`];
            if (data) {
                if (chartInstances[data.chartId1]) {
                    chartInstances[data.chartId1].destroy();
                    delete chartInstances[data.chartId1];
                }
                if (chartInstances[data.chartId2]) {
                    chartInstances[data.chartId2].destroy();
                    delete chartInstances[data.chartId2];
                }
                renderChart(data.chartId1, data.chartData1.labels, data.chartData1.values, settings);
                renderChart(data.chartId2, data.chartData2.labels, data.chartData2.values, settings);
            }
        }

        window.toggleCharts = function(categoryKey) {
            const container = document.getElementById(`chartContainer_${categoryKey}`);
            const label = document.getElementById(`toggleLabel_${categoryKey}`);
            if (!container) return;
            const isHidden = container.classList.contains('hidden');
            if (isHidden) {
                container.classList.remove('hidden');
                label.textContent = '📊 收起饼图分析';
                const settings = getSettings(categoryKey);
                const data = window[`chartData_${categoryKey}`];
                if (data) {
                    renderChart(data.chartId1, data.chartData1.labels, data.chartData1.values, settings);
                    renderChart(data.chartId2, data.chartData2.labels, data.chartData2.values, settings);
                }
                applyTableFontSize(categoryKey);
            } else {
                container.classList.add('hidden');
                label.textContent = '📊 展开饼图分析';
                const data = window[`chartData_${categoryKey}`];
                if (data) {
                    if (chartInstances[data.chartId1]) {
                        chartInstances[data.chartId1].destroy();
                        delete chartInstances[data.chartId1];
                    }
                    if (chartInstances[data.chartId2]) {
                        chartInstances[data.chartId2].destroy();
                        delete chartInstances[data.chartId2];
                    }
                }
            }
        };

        function renderChart(canvasId, labels, values, settings) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            if (chartInstances[canvasId]) {
                chartInstances[canvasId].destroy();
                delete chartInstances[canvasId];
            }
            const ctx = canvas.getContext('2d');
            const colors = generateColors(labels.length);

            const total = values.reduce((a, b) => a + b, 0);
            const fs = settings.fontSize || 9;
            const showName = settings.showName !== undefined ? settings.showName : true;
            const showValue = settings.showValue || false;
            const showPercent = settings.showPercent || false;
            // radius: 20% ~ 200% 控制饼图实际大小
            const radiusPercent = (settings.radius || 100) / 100;

            if (total === 0 || labels.length === 0) {
                chartInstances[canvasId] = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['无数据'],
                        datasets: [{
                            data: [1],
                            backgroundColor: ['#e2e8f0'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: false }
                        }
                    },
                    plugins: [{
                        id: 'noDataLabel',
                        afterDraw(chart) {
                            const { ctx } = chart;
                            ctx.save();
                            ctx.font = '14px Inter, sans-serif';
                            ctx.fillStyle = '#94a3b8';
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            const { width, height } = chart;
                            ctx.fillText('暂无数据', width / 2, height / 2);
                            ctx.restore();
                        }
                    }]
                });
                return;
            }

            // 计算半径：基础半径50%，乘以百分比
            const radiusValue = 50 * radiusPercent;

            chartInstances[canvasId] = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { 
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    let value = context.parsed || 0;
                                    let total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    let percentage = total > 0 ? ((value / total) * 100).toFixed(1) : 0;
                                    return label + ': ' + value.toFixed(1) + ' (' + percentage + '%)';
                                }
                            }
                        }
                    },
                    // 关键：通过radius控制饼图实际大小
                    radius: Math.min(radiusValue, 100) + '%'
                },
                plugins: [{
                    id: 'customLabels',
                    afterDraw(chart) {
                        const { ctx, data } = chart;
                        const meta = chart.getDatasetMeta(0);
                        const total = data.datasets[0].data.reduce((a, b) => a + b, 0);
                        if (total === 0) return;
                        // 根据饼图大小调整字体
                        const sizeFactor = Math.min(radiusPercent, 1.5);
                        const fontSizeFinal = Math.max(4, Math.min(22, fs * Math.min(sizeFactor * 1.1, 1.8)));
                        ctx.font = `bold ${fontSizeFinal}px Inter, sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        meta.data.forEach((arc, i) => {
                            const value = data.datasets[0].data[i];
                            const percentage = ((value / total) * 100);
                            if (percentage < 2) return;
                            const label = data.labels[i];
                            const angle = (arc.startAngle + arc.endAngle) / 2;
                            const radius = arc.outerRadius * 0.65;
                            const x = arc.x + Math.cos(angle) * radius;
                            const y = arc.y + Math.sin(angle) * radius;

                            let displayParts = [];
                            if (showName) {
                                const maxLen = Math.max(4, Math.floor(10 * Math.min(sizeFactor, 1.2)));
                                const displayLabel = label.length > maxLen ? label.substring(0, maxLen - 1) + '…' : label;
                                displayParts.push(displayLabel);
                            }
                            if (showValue) {
                                displayParts.push(value.toFixed(1));
                            }
                            if (showPercent) {
                                displayParts.push(percentage.toFixed(1) + '%');
                            }
                            if (displayParts.length === 0) return;

                            ctx.shadowColor = 'rgba(255,255,255,0.8)';
                            ctx.shadowBlur = 4;
                            ctx.fillStyle = '#1e293b';
                            const displayText = displayParts.join(' ');
                            if (displayText.length > 12) {
                                const mid = Math.ceil(displayText.length / 2);
                                const firstPart = displayText.substring(0, mid);
                                const secondPart = displayText.substring(mid);
                                ctx.fillText(firstPart, x, y - fontSizeFinal * 0.6);
                                ctx.fillText(secondPart, x, y + fontSizeFinal * 0.6);
                            } else {
                                ctx.fillText(displayText, x, y);
                            }
                            ctx.shadowBlur = 0;
                        });
                    }
                }]
            });

            const legendContainer = document.getElementById(`legend_${canvasId}`);
            if (legendContainer) {
                let legendHtml = '';
                const totalVal = values.reduce((a, b) => a + b, 0);
                labels.forEach((label, i) => {
                    const pct = totalVal > 0 ? ((values[i] / totalVal) * 100).toFixed(1) : 0;
                    legendHtml += `
                        <div class="chart-legend-item">
                            <span class="chart-legend-color" style="background: ${colors[i % colors.length]};"></span>
                            <span class="chart-legend-label" title="${label}">${label}</span>
                            <span style="color:#64748b;font-size:10px;">${pct}%</span>
                        </div>
                    `;
                });
                legendContainer.innerHTML = legendHtml;
            }
        }

        window.handleSort = function(category, key) {
            const state = sortStates[category];
            if (state.key === key) state.order = state.order === 'asc' ? 'desc' : 'asc';
            else { state.key = key; state.order = 'desc'; }
            renderAllCategories();
        };

        function getSortIconClass(category, key) {
            const state = sortStates[category];
            if (state.key !== key) return '';
            return state.order === 'asc' ? 'sorted-asc' : 'sorted-desc';
        }

        function renderSpecialPaperTable() {
            const tbody = document.getElementById('specialPaperBody');
            const countSpan = document.getElementById('specialPaperCount');
            const totalContract = document.getElementById('specialTotalContract');
            const totalNonRate = document.getElementById('specialTotalNonRate');

            if (!tbody) return;

            if (specialPaperData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="no-data">暂无特殊纸令数扣减数据</td></tr>`;
                if (countSpan) countSpan.textContent = '共 0 家';
                if (totalContract) totalContract.textContent = '0.00';
                if (totalNonRate) totalNonRate.textContent = '0.00';
                return;
            }

            if (countSpan) countSpan.textContent = `共 ${specialPaperData.length} 家`;

            let html = '';
            let totalContractVal = 0;
            let totalNonRateVal = 0;

            specialPaperData.forEach(item => {
                const contract = item.contract_paper || 0;
                const nonRate = item.non_rate_paper || 0;
                totalContractVal += contract;
                totalNonRateVal += nonRate;
                html += `
                    <tr>
                        <td>${item.factory}</td>
                        <td>${Number(contract).toFixed(2).toLocaleString()}</td>
                        <td>${Number(nonRate).toFixed(2).toLocaleString()}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;

            if (totalContract) totalContract.textContent = Number(totalContractVal).toFixed(2).toLocaleString();
            if (totalNonRate) totalNonRate.textContent = Number(totalNonRateVal).toFixed(2).toLocaleString();

            applySpecialTableFontSize();
        }

        window.exportToCSV = function() {
            let csv = "data:text/csv;charset=utf-8,\uFEFF";
            csv += "类别,印厂名称,本月总品种,总品种平均周期,无线胶钉品种,无线胶钉周期,锁线胶订品种,锁线胶订周期,精装品种,精装周期,全年计划纸令,实际累计进栈,已完成比例,上年同期进栈,同比增长%\n";
            rawData.forEach(item => {
                const rate = (item.plan && item.plan > 0) ? ((item.actual / item.plan) * 100).toFixed(2) : 0;
                const yoy = (item.yoy !== null && item.yoy !== undefined) ? item.yoy.toFixed(2) : '';
                csv += `${item.category},${item.name},${item.totalVariety},${item.totalCycle||''},${item.wbVariety},${item.wbCycle||''},${item.sewnVariety},${item.sewnCycle||''},${item.hardVariety},${item.hardCycle||''},${item.plan||''},${item.actual},${rate},${item.lastYear||''},${yoy}\n`;
            });
            csv += "\n\n特殊纸令数扣减统计\n";
            csv += "印装厂,签合同纸令数,非额定工价纸令数\n";
            specialPaperData.forEach(item => {
                csv += `${item.factory},${item.contract_paper},${item.non_rate_paper}\n`;
            });
            const link = document.createElement('a');
            link.href = encodeURI(csv);
            link.download = "印装生产数据_2026.csv";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
